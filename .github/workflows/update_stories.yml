name: Daily CreepCast Story Update
on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout creepcast code
        run: |
          git clone https://x-access-token:${{ github.token }}@github.com/langfordzl/langfordzl.github.io.git repo
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install dependencies
        run: |
          pip install sentence-transformers faiss-cpu requests numpy rank_bm25 huggingface_hub
      - name: Download existing cache from HuggingFace
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python3 - <<'EOF'
          from huggingface_hub import HfApi, hf_hub_download
          import os
          api = HfApi(token=os.environ["HF_TOKEN"])
          os.makedirs("cache", exist_ok=True)
          for f in ["cache/tftc_posts.json", "cache/faiss_index.idx",
                    "cache/faiss_index_posts.json", "cache/faiss_index_chunks.json"]:
              api.hf_hub_download(repo_id="DrCreepyData/creepcast-story-finder",
                                  repo_type="space", filename=f, local_dir=".")
          print("Downloaded cache files")
          EOF
      - name: Fetch new stories and update index
        run: |
          curl -s -o update_posts.py https://huggingface.co/spaces/DrCreepyData/creepcast-story-finder/raw/main/update_posts.py
          curl -s -o rag_engine.py https://huggingface.co/spaces/DrCreepyData/creepcast-story-finder/raw/main/rag_engine.py
          python3 update_posts.py
      - name: Push updated cache to HuggingFace
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python3 - <<'EOF'
          from huggingface_hub import HfApi
          import os
          api = HfApi(token=os.environ["HF_TOKEN"])
          for f in ["cache/tftc_posts.json", "cache/faiss_index.idx",
                    "cache/faiss_index_posts.json", "cache/faiss_index_chunks.json"]:
              api.upload_file(path_or_fileobj=f, path_in_repo=f,
                              repo_id="DrCreepyData/creepcast-story-finder", repo_type="space")
              print(f"Uploaded {f}")
          EOF
