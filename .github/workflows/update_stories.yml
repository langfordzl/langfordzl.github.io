name: Daily CreepCast Story Update
on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Cache pip
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: creepcast-pip-${{ hashFiles('**/requirements*.txt') }}
          restore-keys: creepcast-pip-

      - name: Install dependencies
        run: pip install sentence-transformers faiss-cpu requests numpy rank_bm25 huggingface_hub beautifulsoup4

      - name: Download scripts and cache from HuggingFace
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python3 - <<'EOF'
          from huggingface_hub import HfApi
          import os
          api = HfApi(token=os.environ["HF_TOKEN"])
          os.makedirs("cache", exist_ok=True)
          files = [
            "update_posts.py", "rag_engine.py",
            "cache/tftc_posts.json",
            "cache/faiss_index.idx",
            "cache/faiss_index_posts.json",
            "cache/faiss_index_chunks.json",
          ]
          for f in files:
              api.hf_hub_download(
                repo_id="DrCreepyData/creepcast-story-finder",
                repo_type="space", filename=f, local_dir=".")
              print(f"Downloaded {f}")
          EOF

      - name: Fetch new stories and update index
        run: python3 update_posts.py

      - name: Push updated cache to HuggingFace
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python3 - <<'EOF'
          from huggingface_hub import HfApi
          import os
          api = HfApi(token=os.environ["HF_TOKEN"])
          for f in ["cache/tftc_posts.json", "cache/faiss_index.idx",
                    "cache/faiss_index_posts.json", "cache/faiss_index_chunks.json"]:
              api.upload_file(path_or_fileobj=f, path_in_repo=f,
                              repo_id="DrCreepyData/creepcast-story-finder",
                              repo_type="space")
              print(f"Uploaded {f}")
          EOF
